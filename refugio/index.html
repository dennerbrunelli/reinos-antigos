<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b3a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Refúgio</title>
<style>
:root{--pa:#f7dca4;--pb:#e9bd77;--bd:#5e2f0e;--bd2:#b06a2c;--tx:#3a1c07;--ok:#3f8a2a;--bad:#b3261e;--cream:#fff4d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#16241a;color:var(--tx);font-family:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit;color:inherit;cursor:pointer}
.pnl{background:linear-gradient(#f9e2b0,#efc785);border:3px solid var(--bd);border-radius:7px;box-shadow:inset 0 0 0 2px #fdf0d2,inset 0 0 0 4px var(--bd2),0 3px 0 #0007}
.btn{background:linear-gradient(#fbe6b6,#e4b46b);border:2px solid var(--bd);border-radius:6px;box-shadow:inset 0 -3px 0 #c88a44,inset 0 2px 0 #fff6dc,0 2px 0 #0006;font-weight:700;color:var(--tx);padding:4px 10px;font-size:14px}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 #c88a44,0 1px 0 #0006;filter:brightness(1.08)}
.btn.on{background:linear-gradient(#ffd56a,#e89a2a);box-shadow:inset 0 -3px 0 #b8701a,inset 0 2px 0 #fff3c0,0 2px 0 #0006}
.btn[disabled]{opacity:.45}
.btn.ok{background:linear-gradient(#b8f08a,#5fb03a);color:#123a06}
.btn.no{background:linear-gradient(#ffc0a8,#e0704a);color:#4a0e02}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.show{display:block}
#hud>*{pointer-events:auto}
#top{position:absolute;top:calc(4px + env(safe-area-inset-top));left:calc(4px + env(safe-area-inset-left));right:calc(4px + env(safe-area-inset-right));display:flex;gap:4px;align-items:center;padding:4px 6px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
#top::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:3px;padding:1px 6px;height:26px;background:var(--cream);border:2px solid #b8793a;border-radius:5px;font-size:13px;font-weight:700;flex:0 0 auto}
.chip span{font-size:14px}
.chip.bad{background:#ffd0c4;border-color:var(--bad);color:var(--bad);animation:pulse 1s infinite alternate}
@keyframes pulse{to{background:#ffb09c}}
.chip.date{gap:5px}.chip.date i{font-style:normal;font-weight:400;font-size:12px;opacity:.8}
#bottom{position:absolute;left:calc(4px + env(safe-area-inset-left));bottom:calc(4px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:4px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:52px;padding:2px}
.cat span{font-size:22px;line-height:24px}.cat small{font-size:10px}
#ctl{position:absolute;right:calc(4px + env(safe-area-inset-right));bottom:calc(4px + env(safe-area-inset-bottom));display:flex;gap:3px;padding:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 320px)}
.btn.sm{width:38px;height:38px;padding:0;font-size:17px}
#sub{position:absolute;left:calc(4px + env(safe-area-inset-left));bottom:calc(72px + env(safe-area-inset-bottom));display:none;gap:5px;padding:6px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:thin}
#sub.show{display:flex}
.card{flex:0 0 auto;width:104px;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;background:linear-gradient(#fff4d8,#f2d39a);border:2px solid var(--bd);border-radius:6px;box-shadow:inset 0 -3px 0 #d6a45c,0 2px 0 #0005}
.card:active{filter:brightness(1.1)}
.card img{height:40px;image-rendering:pixelated}
.card .ic{font-size:30px;height:40px;line-height:40px}
.card b{font-size:12px;line-height:13px;text-align:center}
.card small{font-size:11px;text-align:center;line-height:13px}
.card small .no{color:var(--bad);font-weight:700}
#info{position:absolute;right:calc(4px + env(safe-area-inset-right));top:calc(44px + env(safe-area-inset-top));width:min(290px,48vw);max-height:calc(100% - 110px);overflow-y:auto;padding:8px 10px;display:none;font-size:13px}
#info.show{display:block}
#info h3{margin:0 0 2px;font-size:16px}
#info .sub{font-size:12px;opacity:.85;margin-bottom:4px}
#info p{margin:5px 0}
#info .act{font-style:italic;color:#6a3a10;min-height:16px}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.bar span{width:72px}
.bar div{flex:1;height:9px;background:#7a4a20;border:1px solid var(--bd);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.row{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.row.c{justify-content:center;margin-top:12px}
.btn.sm2{font-size:12px;padding:4px 8px}
.btn.sq{width:30px;height:28px;padding:0;font-size:18px;line-height:20px}
.wk{display:flex;align-items:center;gap:4px;background:#fff4d880;border-radius:5px;padding:4px}.wk span{flex:1;font-size:12px}
.names{font-size:12px;opacity:.85}
.hint{font-size:12px;color:#7a4a1a}
.stk{display:flex;flex-wrap:wrap;gap:4px}.stk span{background:var(--cream);border:1px solid #b8793a;border-radius:4px;padding:1px 4px;font-size:12px}
#mode{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));display:none;align-items:center;gap:8px;padding:6px 8px;max-width:min(560px,calc(100vw - 16px))}
#mode.show{display:flex}
#mode .mt{display:flex;flex-direction:column;font-size:13px;min-width:0}#mode .mt small{font-size:11px;opacity:.85}
#mode .btn{white-space:nowrap;padding:8px 12px}
#toasts{position:absolute;top:calc(46px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:min(520px,70vw)}
.toast{background:#3a1c07e6;color:#fff4d8;border:2px solid #e9bd77;border-radius:6px;padding:5px 10px;font-size:13px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 0 #0006;transition:opacity .6s,transform .6s;animation:tin .3s}
.toast.bad{background:#6a1208ee;border-color:#ff9a7a}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#dlg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#dlg.show{display:flex}
#dlg .box{max-width:540px;width:100%;max-height:calc(100vh - 24px);overflow-y:auto;padding:14px 18px;font-size:14px;line-height:1.45}
#dlg h2{margin:2px 0 8px;font-size:20px}
#dlg h4{margin:12px 0 4px}
#dlg .kick{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#8a4a1a}
#dlg .story{font-size:15px}
#dlg .goal{background:#fff4d8;border:2px dashed var(--bd2);border-radius:6px;padding:6px 10px;margin-top:8px}
#dlg ul{margin:4px 0;padding-left:18px;font-size:13px}
#dlg ul.log{list-style:none;padding:0}#dlg ul.log li{margin:2px 0}
#dlg .btn.big{padding:8px 16px;font-size:15px}
.help p{margin:6px 0}
table.jobs{width:100%;border-collapse:collapse;font-size:13px}table.jobs td{padding:3px 2px;border-bottom:1px solid #c8954a66}
.lnk{background:none;border:0;padding:0;font-weight:700;text-align:left;text-decoration:underline dotted;font-size:13px}
#title{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10;background:radial-gradient(ellipse at center,#0000 30%,#0007)}
#title.show{display:flex}
#title h1{margin:0;font-size:clamp(44px,11vw,84px);color:#ffe9b0;letter-spacing:2px;text-shadow:0 4px 0 #5e2f0e,0 -2px 0 #5e2f0e,3px 0 0 #5e2f0e,-3px 0 0 #5e2f0e,0 8px 0 #0006;font-family:Georgia,"Times New Roman",serif}
#title .tag{color:#fff4d8;font-size:16px;text-shadow:0 2px 0 #000a;margin-top:-6px;text-align:center}
#title .menu{display:flex;flex-direction:column;gap:8px;margin-top:8px;width:220px}
#title .btn{font-size:17px;padding:10px}
#title .foot{position:absolute;bottom:8px;color:#fff4d8aa;font-size:11px;text-shadow:0 1px 0 #000}
@media (max-height:420px){#dlg .box{padding:10px 14px;font-size:13px;line-height:1.35}#dlg .story{font-size:13.5px}#dlg h2{font-size:17px;margin:0 0 4px}#dlg .row.c{margin-top:8px}#title h1{font-size:52px}#title .menu{flex-direction:row;width:auto}#title .btn{font-size:15px;padding:8px 12px}}
@media (max-width:700px){.cat{width:48px}.cat small{font-size:9px}#ctl{max-width:calc(100vw - 270px)}.btn.sm{width:34px;height:34px;font-size:15px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="top" class="pnl"></div>
  <div id="toasts"></div>
  <div id="info" class="pnl"></div>
  <div id="sub" class="pnl"></div>
  <div id="mode" class="pnl"></div>
  <div id="bottom" class="pnl"><div id="cats" style="display:flex;gap:4px"></div></div>
  <div id="ctl" class="pnl"></div>
</div>
<div id="title">
  <h1>Refúgio</h1>
  <div class="tag">Cinco famílias exiladas. Um vale desconhecido. O inverno chegando.</div>
  <div class="menu">
    <button class="btn" id="t_cont">▶ Continuar</button>
    <button class="btn" id="t_new">🌱 Novo jogo</button>
    <button class="btn" id="t_help">❓ Como jogar</button>
  </div>
  <div class="foot">Funciona sem internet depois de aberto uma vez</div>
</div>
<div id="dlg"></div>
<script src="js/arte.js"></script>
<script src="js/mundo.js"></script>
<script src="js/gente.js"></script>
<script src="js/tela.js"></script>
</body>
</html>
